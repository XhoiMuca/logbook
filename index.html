<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(224,176,58,.15)}
body{margin:0;background:#101315;color:#EDEAE3;font:15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:100px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;touch-action:manipulation}
header{position:sticky;top:0;z-index:9;background:#101315;border-bottom:1px solid #2E3740;padding:10px 14px 0}
.tr{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{margin:0;font-size:17px;font-weight:650}
.sub{font-size:12px;color:#5C666F;text-align:right;min-width:0}
.wkrow{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:650;padding:3px 8px;border-radius:20px;background:#212830;color:#8A949E;border:1px solid #2E3740}
.chip.gold{background:#241E10;color:#E0B03A;border-color:#4A3C1C}
.chip.grn{background:#1B2A1E;color:#9BD07E;border-color:#33513F}
.chip.blu{background:#16242B;color:#6FA8C7;border-color:#2A4550}
.meta{display:flex;gap:8px;margin-top:9px}
.meta label{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.meta span{font-size:11px;color:#8A949E}
select,input,textarea{background:#191E22;border:1px solid #2E3740;color:#EDEAE3;border-radius:8px;padding:9px;font:inherit;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.tabs{display:flex;margin:11px -14px 0;border-top:1px solid #2E3740}
.tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:#5C666F;font-weight:600;padding:12px 0;font-size:12.5px}
.tabs button.sel{color:#E0B03A;border-bottom-color:#E0B03A}
main{padding:14px}
.sbar{font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:11px;line-height:1.45;background:#1B2A1E;border:1px solid #33513F;color:#9BD07E;word-break:break-word}
.sbar.bad{background:#2A2214;border-color:#5A4520;color:#E0B03A}
.ex{background:#191E22;border:1px solid #2E3740;border-radius:10px;margin-bottom:9px;overflow:hidden}
.ex.done{border-color:#33513F}
.eh{display:flex;align-items:center;gap:11px;padding:13px}
.ix{width:24px;height:24px;flex:none;border-radius:5px;background:#212830;color:#5C666F;font-size:11px;font-weight:700;display:grid;place-items:center}
.ex.done .ix{background:#2A4434;color:#57A97C}
.en{flex:1;min-width:0}
.en b{display:block;font-size:14.5px;font-weight:600}
.en b em{font-style:normal;color:#E0B03A;font-size:12px;margin-left:5px}
.es{font-size:12px;color:#8A949E;margin-top:2px}
.es i{font-style:normal;color:#E0B03A}
.mdot{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:1px}
.cv{color:#5C666F;font-size:15px}
.bd{padding:0 13px 13px;border-top:1px solid #2E3740}
.rx{margin:11px 0 9px;border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.5;border:1px solid}
.rx b{font-size:15px;display:block;margin-bottom:3px;font-weight:700}
.rx.up{background:#20321F;border-color:#33513F;color:#9BD07E}
.rx.hold{background:#212830;border-color:#2E3740;color:#A9B3BD}
.rx.stall{background:#2A1E14;border-color:#5A3C20;color:#DE9A6A}
.rx.deload{background:#16242B;border-color:#2A4550;color:#6FA8C7}
.rx.new{background:#241E10;border-color:#4A3C1C;color:#E0B03A}
.un{margin:0 0 9px;font-size:12px;color:#8A949E;background:#151A1E;border:1px solid #2E3740;border-radius:8px;padding:8px 11px;line-height:1.45}
.un b{color:#E0B03A;font-weight:600}
.lt{margin:0 0 9px;font-size:12.5px;color:#8A949E}
.lt b{color:#EDEAE3}
.cue{font-size:12px;color:#5C666F;margin:0 0 11px;line-height:1.5}
.hd,.st{display:grid;grid-template-columns:19px 1fr 1fr 56px 30px;gap:6px;align-items:center;margin-bottom:7px}
.hd div{text-align:center;font-size:10px;color:#5C666F;font-weight:700;letter-spacing:.03em}
.sl{font-size:11px;color:#5C666F;font-weight:700;text-align:center}
.st input{text-align:center;font-size:17px;font-weight:600;padding:11px 2px}
.st select{font-size:12px;padding:11px 2px;text-align:center;text-align-last:center;color:#8A949E}
.st input.beat{border-color:#33513F;background:#182219}
.st input.miss{border-color:#5A3C20}
.st input.bad{border-color:#C6613C;background:#2A1A14}
.wrn{font-size:11.5px;color:#DE9A6A;background:#2A1E14;border:1px solid #5A3C20;border-radius:7px;padding:7px 9px;margin:-2px 0 8px;line-height:1.4}
.wrn[hidden]{display:none}
.eds{font-size:12.5px;color:#E0B03A;font-weight:600;margin:12px 0 7px;padding-top:9px;border-top:1px solid #2E3740}
.eds:first-of-type{border-top:none;padding-top:0}
.st input::placeholder{font-weight:400;font-size:12.5px;color:#5C666F}
.xb{background:none;border:1px solid #2E3740;border-radius:7px;color:#5C666F;font-size:15px;padding:10px 0}
.ft{display:flex;gap:7px;margin-top:4px;flex-wrap:wrap}
.mn{flex:1;background:none;border:1px solid #2E3740;border-radius:8px;color:#8A949E;font-size:12.5px;font-weight:600;padding:10px;min-width:74px}
.mn.go{border-color:#4A3C1C;color:#E0B03A}
.hint{margin-top:10px;font-size:12.5px;padding:9px 11px;border-radius:8px;line-height:1.45}
.hint.up{background:#20321F;color:#9BD07E;border:1px solid #33513F}
.hint.hold{background:#212830;color:#8A949E;border:1px solid #2E3740}
.bar{position:fixed;left:0;right:0;bottom:0;background:#101315;border-top:1px solid #2E3740;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:9}
.bar .ct{flex:1;font-size:12.5px;color:#8A949E;min-width:0}
.bar .ct b{color:#57A97C}
.ab{background:none;color:#8A949E;border:1px solid #2E3740;border-radius:9px;padding:11px 14px;font-weight:600;white-space:nowrap}
.ab.go{border-color:#4A3C1C;color:#E0B03A}
.tmr{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.tmr .tv{font-size:21px;font-weight:700;color:#E0B03A;min-width:56px}
.tmr .tl{font-size:11.5px;color:#8A949E;flex:1;min-width:0;line-height:1.3}
.tmr .tv.go{color:#57A97C}
.card{background:#191E22;border:1px solid #2E3740;border-radius:10px;padding:13px;margin-bottom:9px}
.card h3{margin:0 0 4px;font-size:14px;font-weight:650}
.card h3 small{font-weight:500;color:#5C666F;font-size:11.5px;margin-left:6px}
.card p{margin:0 0 11px;font-size:12.5px;color:#8A949E;line-height:1.55}
.card p:last-child{margin-bottom:0}
.card ul{margin:0 0 11px;padding-left:17px;font-size:12.5px;color:#8A949E;line-height:1.6}
.card ul:last-child{margin-bottom:0}
.card ul b{color:#EDEAE3;font-weight:600}
.rw{display:flex;gap:8px;flex-wrap:wrap}
.ht{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wn{font-size:12px;color:#5C666F;margin-bottom:9px}
.hr{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:6px 0;border-top:1px solid #2E3740}
.hr span:first-child{color:#8A949E;flex:1;min-width:0}
.hr span:last-child{color:#EDEAE3;white-space:nowrap}
.mt{color:#5C666F;font-size:13.5px;text-align:center;padding:44px 20px;line-height:1.7}
textarea{height:120px;font-size:11px;font-family:ui-monospace,monospace;resize:vertical}
.tst{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#212830;border:1px solid #2E3740;color:#EDEAE3;padding:11px 17px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:88vw;text-align:center;line-height:1.4}
.tst.on{opacity:1}
.tst.pr{background:#241E10;border-color:#E0B03A;color:#E0B03A;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.kpi{background:#191E22;border:1px solid #2E3740;border-radius:11px;padding:12px 13px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.kpi .k{font-size:11px;color:#828C96;margin-top:4px}
.kpi .d{font-size:11px;margin-top:3px;color:#57A97C}
.kpi .d.dn{color:#C6613C}
.kpi .d.nu{color:#5C666F}
svg{display:block;width:100%;height:auto}
.pl{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #2E3740}
.pl .nm{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .vv{font-size:12.5px;font-weight:600;white-space:nowrap;min-width:52px;text-align:right}
.pl .ch{font-size:11.5px;font-weight:600;white-space:nowrap;min-width:46px;text-align:right;color:#57A97C}
.pl .ch.flat{color:#5C666F}
.pl .ch.dn{color:#C6613C}
.mg{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:9px 0 7px}
.mg i{display:block;height:100%}
.lgd{display:flex;flex-wrap:wrap;gap:9px;font-size:11.5px;color:#8A949E}
.lgd b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.vr{padding:8px 0;border-top:1px solid #2E3740}
.vr .vt{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.vr .vt b{font-weight:600}
.vr .vb{height:7px;background:#212830;border-radius:4px;position:relative;overflow:hidden}
.vr .vb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.vr .vb u{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.13);text-decoration:none}
.vr .vs{font-size:11px;margin-top:4px}
.ok{color:#57A97C}.lo{color:#E0B03A}.hi{color:#C6613C}.nu{color:#5C666F}
.wu{background:#151A1E;border:1px dashed #2E3740;border-radius:10px;padding:12px 13px;margin-bottom:11px}
.wu h3{margin:0 0 6px;font-size:13px;font-weight:650;color:#E0B03A}
.wu ol{margin:0;padding-left:16px;font-size:12.5px;color:#8A949E;line-height:1.65}
.dis{font-size:11.5px;color:#5C666F;line-height:1.5;padding:4px 2px 0}
</style>
</head>
<body>
<header>
  <div class="tr"><h1 id="ttl">Day A</h1><div class="sub" id="sb">&nbsp;</div></div>
  <div class="wkrow" id="wkrow"></div>
  <div class="meta">
    <label><span>Block</span><select id="blk">
      <option value="0">1 — Fat loss (wk 1–14)</option>
      <option value="1">2 — Strength (wk 15–26)</option>
      <option value="2">3 — Growth (wk 27–39)</option>
      <option value="3">4 — Definition (wk 40–52)</option></select></label>
    <label style="max-width:92px"><span>Bodyweight</span>
      <input id="bw" inputmode="decimal" placeholder="kg" class="num"></label>
    <label style="max-width:84px"><span>Steps</span>
      <input id="stp" inputmode="numeric" placeholder="k" class="num"></label>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="0" class="sel">A</button>
    <button data-tab="1">B</button>
    <button data-tab="2">C</button>
    <button data-tab="c">Coach</button>
    <button data-tab="s">Stats</button>
    <button data-tab="h">Log</button>
    <button data-tab="b">Data</button>
  </div>
</header>

<main id="app"></main>

<div class="bar">
  <div class="ct" id="ct">&nbsp;</div>
  <button class="ab" data-act="undo" id="ub" style="display:none">Undo</button>
  <button class="ab go" data-act="file">File now</button>
</div>
<div class="tst" id="tst"></div>

<script>

X("Triceps rope pushdown",["3x12-15","3x10-12","4x10-12","3x15-20"],

/* ============================================================
   4. small maths
   ============================================================ */
function ns(t){return parseInt(String(t).split("x")[0],10)||3;}
function rlo(t){var m=String(t).match(/x\s*(\d+)/);return m?+m[1]:null;}
function rhi(t){var m=String(t).match(/x\s*(?:(\d+)-)?(\d+)/);return m?+m[2]:null;}
function fmt(n){if(n===null||n===undefined||isNaN(n))return "";
  return (Math.round(n*100)/100).toString();}
function rnd(v,i){i=i||2.5;return Math.round(v/i)*i;}
function d0(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function week(){return Math.max(1,Math.floor((d0(Date.now())-d0(db.start||START_DEFAULT))/864e5/7)+1);}
function deload(w){return w%6===0;}
function blockFor(w){var i;for(i=0;i<BLOCKS.length;i++)if(w>=BLOCKS[i].w[0]&&w<=BLOCKS[i].w[1])return i;return 3;}
function blk(){return +E("blk").value||0;}

function wo(e){var w=[],i;for(i=0;i<e.sets.length;i++)if(e.sets[i].w)w.push(e.sets[i].w);
  if(!w.length)return "";for(i=1;i<w.length;i++)if(w[i]!==w[0])return w.join("/");return w[0];}
function rp(e){var a=[],i;for(i=0;i<e.sets.length;i++)a.push(e.sets[i].r);return a.join(" / ");}
function vol(e){var v=0,i;for(i=0;i<e.sets.length;i++)
  v+=(parseFloat(e.sets[i].w)||0)*(parseInt(e.sets[i].r,10)||0);return v;}
function orm(e){var b=0,i;for(i=0;i<e.sets.length;i++){
  var w=parseFloat(e.sets[i].w)||0,r=parseInt(e.sets[i].r,10)||0;
  if(w>0&&r>0){var x=w*(1+r/30);if(x>b)b=x;}}return b;}
function topW(e){var b=0,i;for(i=0;i<e.sets.length;i++){var w=parseFloat(e.sets[i].w)||0;if(w>b)b=w;}return b;}
function loW(e){var b=null,i;for(i=0;i<e.sets.length;i++){var w=parseFloat(e.sets[i].w)||0;
  if(w>0&&(b===null||w<b))b=w;}return b;}
function totR(e){var t=0,i;for(i=0;i<e.sets.length;i++)t+=parseInt(e.sets[i].r,10)||0;return t;}
/* average reps-in-reserve for a session, null unless at least two sets carry one */
function avgRIR(e){var s=0,n=0,i;for(i=0;i<e.sets.length;i++){var q=e.sets[i].q;
  if(q!==""&&q!==undefined&&q!==null){s+=parseInt(q,10)||0;n++;}}
  return n>=2?s/n:null;}
/* does this look like a fat finger rather than a set */
function odd(nm,w,r){
  var W=parseFloat(w)||0,R=parseInt(r,10)||0,h=hist(nm),best=0,i;
  for(i=0;i<h.length;i++){var t=topW(h[i].e);if(t>best)best=t;}
  if(r!==""&&R>100)return R+" reps? Check that before it becomes your record.";
  if(W>500)return fmt(W)+" kg looks like a slip.";
  if(best>0&&W>best*2.5&&W-best>20)
    return fmt(W)+" kg is more than double the "+fmt(best)+" kg you have ever done here. Check it.";
  return "";}
function minR(e){var b=null,i;for(i=0;i<e.sets.length;i++){var r=parseInt(e.sets[i].r,10)||0;
  if(r>0&&(b===null||r<b))b=r;}return b;}

function meta(nm){var i,j;for(i=0;i<PLAN.length;i++)for(j=0;j<PLAN[i].x.length;j++)
  if(PLAN[i].x[j].n===nm)return PLAN[i].x[j];return null;}
function musOf(nm){var m=meta(nm);return m?m.m:(RETIRED[nm]||null);}
function colOf(nm){var g=musOf(nm);return g?MUS[g]:"#8A949E";}
function allEx(){var m={},i,j;for(i=0;i<db.sessions.length;i++)
  for(j=0;j<db.sessions[i].entries.length;j++){var e=db.sessions[i].entries[j];
    if(!m[e.name])m[e.name]=[];m[e.name].push({d:db.sessions[i].date,e:e});}return m;}
function hist(nm){return allEx()[nm]||[];}
function prev(nm){var h=hist(nm);return h.length?h[h.length-1].e:null;}
function bestOrm(nm,skipLast){var h=hist(nm),b=0,i,n=h.length-(skipLast?1:0);
  for(i=0;i<n;i++){var o=orm(h[i].e);if(o>b)b=o;}return b;}
function lin(p){var n=p.length,i,sx=0,sy=0,sxy=0,sxx=0;
  if(n<2)return null;
  for(i=0;i<n;i++){sx+=p[i].x;sy+=p[i].y;sxy+=p[i].x*p[i].y;sxx+=p[i].x*p[i].x;}
  var d=n*sxx-sx*sx;if(!d)return null;
  var m=(n*sxy-sx*sy)/d;return {m:m,b:(sy-m*sx)/n};}

/* rest seconds for this exercise in this block */
function restFor(ex,b){return Math.round(ex.r*[0.85,1.30,1.05,0.75][b]/15)*15;}

/* plate breakdown per side, 20 kg bar */
function plates(total){
  var bar=20,each=(total-bar)/2,out=[],P=[20,15,10,5,2.5,1.25],i;
  if(each<=0)return total<bar?fmt(total)+" kg is lighter than an empty bar":"just the empty 20 kg bar";
  for(i=0;i<P.length;i++)while(each>=P[i]-0.001){out.push(P[i]);each-=P[i];}
  if(each>0.05)return "";
  return out.length?(fmt(total)+" kg = the 20 kg bar plus "+out.join(" + ")+" per side"):"";}

/* warm-up ramp for a heavy working weight */
function ramp(w,bar){
  if(!w||w<30)return null;
  var a=rnd(w*0.5,2.5),b=rnd(w*0.75,2.5);
  if(bar&&a<20)a=20;
  return a+" kg x 5, then "+b+" kg x 3";}

/* ============================================================
   5. the coach: what should I do today, on this exercise
   ============================================================ */
function presc(ex,b,wk){
  var tgt=ex.t[b],n=ns(tgt),lo=rlo(tgt),hi=rhi(tgt),h=hist(ex.n),dl=deload(wk);
  var o={n:n,lo:lo,hi:hi,tgt:tgt,w:null,reps:lo,head:"",why:"",tone:"hold"};

  if(dl){o.n=Math.max(2,n-1);
    var lw=h.length?topW(h[h.length-1].e):0;
    o.w=lw?rnd(lw*0.65,ex.i):null;o.reps=lo;o.tone="deload";
    o.head="Deload: "+(o.w?fmt(o.w)+" kg x "+lo:lo+" easy reps")+", "+o.n+" sets";
    o.why="Recovery week. Two thirds of the weight, stop four reps short of hard. You are letting the joints and the nervous system catch up, not proving anything.";
    return o;}

  if(!h.length){o.tone="new";o.head="First time: find your weight";
    o.why="Pick something you could stop three reps short with, do "+(lo||10)+" reps, and write down exactly what you used. That number is the target from now on.";
    return o;}

  var last=h[h.length-1].e,tw=topW(last),mr=minR(last),full=(last.sets.length>=n);
  var allTop=full&&hi!==null;
  var j;if(allTop)for(j=0;j<last.sets.length;j++)if((parseInt(last.sets[j].r,10)||0)<hi)allTop=false;
  var ar=avgRIR(last);
  o.rir=ar;

  /* you told us it was easy: move now, do not wait for the rep target to fill up */
  if(ar!==null&&ar>=3&&tw>0&&!ex.bw){
    o.w=ex.inv?Math.max(0,rnd(tw-ex.i,ex.i)):rnd(tw+ex.i,ex.i);
    o.reps=lo;o.tone="up";
    o.head=(ex.inv?"Less help: ":"Go up: ")+fmt(o.w)+" kg x "+lo;
    o.why="You logged about "+fmt(Math.round(ar*10)/10)+" reps still in the tank last time. That is too easy to build anything, so "+
      (ex.inv?"the assistance comes down":"the weight goes up")+" now instead of waiting for the reps to creep up. Aim to finish sets at 1 or 2 left.";
    return o;}

  /* every set to failure and the reps still did not move: that is fatigue, not effort */
  if(ar!==null&&ar<=0.5&&tw>0&&h.length>=2&&totR(last)<=totR(h[h.length-2].e)){
    o.w=tw;o.reps=mr||lo;o.tone="stall";
    o.head="Hold "+fmt(tw)+" kg, leave one rep";
    o.why="Every set went to failure last time and the reps still did not move. That is fatigue, not effort. Same weight, stop one rep short on each set, and it will come back next session.";
    return o;}

  /* stalled: same top weight three sessions running with no rep gain */
  if(h.length>=3&&tw>0){
    var a=h[h.length-3].e,c=h[h.length-2].e;
    if(topW(a)===tw&&topW(c)===tw&&totR(last)<=totR(a)){
      o.tone="stall";o.w=rnd(tw*0.9,ex.i);o.reps=hi||lo;
      o.head="Reset: "+fmt(o.w)+" kg x "+(hi||lo);
      o.why="Three sessions stuck at "+fmt(tw)+" kg with no extra reps. Drop ten percent, rebuild for two weeks, and you will go straight past it. Or swap to "+
        (ex.alt?ex.alt.replace(/\.$/,"").toLowerCase():"a close variation")+" for a month.";
      return o;}}

  if(ex.bw||!tw){
    var t2=totR(last);
    o.tone=allTop?"up":"hold";o.w=null;o.reps=(mr||lo)+1;
    o.head=hi?("Aim "+Math.min(hi,(mr||lo)+1)+" reps a set"):("Beat "+t2+" total reps");
    o.why="Bodyweight. Add reps until the top of the range is easy, then slow the lowering down to three seconds instead of adding more reps.";
    return o;}

  if(allTop){
    if(ex.inv){o.w=Math.max(0,rnd(tw-ex.i,ex.i));o.head="Less help: "+fmt(o.w)+" kg assist x "+lo;
      o.why="You hit "+hi+" on every set. Take "+fmt(ex.i)+" kg off the assistance - that makes it harder - and start again at "+lo+" reps.";}
    else{o.w=rnd(tw+ex.i,ex.i);o.head="Go up: "+fmt(o.w)+" kg x "+lo;
      o.why="You hit "+hi+" on every set at "+fmt(tw)+" kg. Add "+fmt(ex.i)+" kg and start the range again from the bottom.";}
    o.reps=lo;o.tone="up";return o;}

  o.w=tw;o.reps=hi?Math.min(hi,(mr||lo)+1):(mr||lo)+1;o.tone="hold";
  o.head="Same "+fmt(tw)+" kg"+(ex.inv?" of help":"")+", chase "+o.reps+" reps";
  o.why="Last time: "+rp(last)+". Keep the weight and get one more rep on every set. When all "+n+" sets hit "+hi+
    (ex.inv?", the assistance comes down "+fmt(ex.i)+" kg and it gets harder.":", the weight goes up.");
  return o;}

function beep(){
  try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    var i;for(i=0;i<2;i++){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*0.22;
      o.frequency.value=i?1046:880;o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);o.start(t);o.stop(t+0.2);}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([180,90,180]);}catch(e){}}
function startRest(sec,nm){
  rest={end:Date.now()+sec*1000,len:sec,ex:nm};
  if(!tick)tick=setInterval(count,250);count();}
function stopRest(){rest={end:0,len:0,ex:""};
  if(tick){clearInterval(tick);tick=null;}count();}

/* ============================================================
   7. storage
   ============================================================ */
function TO(p,ms){return new Promise(function(ok,no){var d=0,
  t=setTimeout(function(){if(!d){d=1;no(new Error("timed out after "+ms+"ms"));}},ms);
  Promise.resolve(p).then(function(v){if(!d){d=1;clearTimeout(t);ok(v);}},
    function(e){if(!d){d=1;clearTimeout(t);no(e);}});});}
function initStore(){
  if(window.storage&&window.storage.get&&window.storage.set){
    lg("store","window.storage present, calling get()");
    return TO(window.storage.get(KEY),4000).then(function(r){
      mode="claude";
      getFn=function(){return TO(window.storage.get(KEY),6000).then(function(x){return x&&x.value?x.value:null;});};
      setFn=function(v){return TO(window.storage.set(KEY,v),6000);};
      lg("store","claude storage OK");
      return r&&r.value?r.value:null;},
    function(e){lg("store","claude FAILED: "+er(e));return local();});}
  lg("store","window.storage NOT present");
  return local();}
function local(){
  try{localStorage.setItem(KEY+"-p","1");localStorage.removeItem(KEY+"-p");
    mode="browser";
    getFn=function(){return Promise.resolve(localStorage.getItem(KEY));};
    setFn=function(v){localStorage.setItem(KEY,v);
      try{localStorage.setItem(KEY+"-bak",v);}catch(e){}
      return Promise.resolve(1);};
    lg("store","browser storage OK on "+location.protocol);
    return Promise.resolve(localStorage.getItem(KEY));
  }catch(e){
    lg("store","browser storage FAILED: "+er(e));
    mode="none";note=er(e);var mem=null;
    getFn=function(){return Promise.resolve(mem);};
    setFn=function(v){mem=v;return Promise.resolve(1);};
    return Promise.resolve(null);}}
function save(){
  db.tab=(typeof tab==="number")?tab:db.tab;
  db.block=blk();db.bw=E("bw").value;db.steps=E("stp").value;
  if(!setFn)return Promise.resolve(false);
  try{var s=JSON.stringify(db);
    return setFn(s).then(function(){lg("save","ok, "+s.length+" chars");return true;},
      function(e){note=er(e);lg("save","FAILED: "+er(e));return false;});
  }catch(e){note=er(e);lg("save","THREW: "+er(e));return Promise.resolve(false);}}
/* keystrokes are cheap, disk writes are not */
function qsave(){clearTimeout(saveT);saveT=setTimeout(save,400);}

/* ============================================================
   8. filing a session
   ============================================================ */
function entries(i){
  var p=PLAN[i],b=blk(),wk=week(),out=[],k,j;
  for(k=0;k<p.x.length;k++){
    var ex=p.x[k],n=presc(ex,b,wk).n,d=db.draft[ex.n]||[],got=[];
    for(j=0;j<n&&j<d.length;j++)if(d[j].r&&+d[j].r>0)got.push({w:d[j].w,r:d[j].r,q:d[j].q||""});
    if(got.length)out.push({name:ex.n,sets:got});}
  return out;}
function hasDraft(){var k;for(k in db.draft){var d=db.draft[k],j;
  for(j=0;j<d.length;j++)if(d[j].r)return true;}return false;}
function file(auto){
  var i=(typeof tab==="number")?tab:db.tab,e=entries(i);
  if(!e.length){if(!auto)tst("Nothing to file yet");return;}
  var rec={date:Date.now(),day:PLAN[i].n,block:blk(),bw:E("bw").value,steps:E("stp").value,
    week:week(),dur:sesStart?Math.round((Date.now()-sesStart)/60000):0,entries:e};
  undoRec={date:rec.date,draft:JSON.parse(JSON.stringify(db.draft))};
  db.sessions.push(rec);db.draft={};sesStart=0;stopRest();
  lg("file",PLAN[i].n+" filed with "+e.length+" exercises");
  save().then(function(ok){paint();
    tst(ok?(auto?"Filed automatically. Next up "+nextDay()+".":"Session filed. Next up "+nextDay()+".")
          :"Filed here, but not saved - open Data and copy your backup out");});}
function autoFile(){
  var i=(typeof tab==="number")?tab:0,p=PLAN[i],b=blk(),wk=week(),done=0,k,j;
  for(k=0;k<p.x.length;k++){var n=presc(p.x[k],b,wk).n,d=db.draft[p.x[k].n]||[],c=0;
    for(j=0;j<n&&j<d.length;j++)if(d[j].r)c++;
    if(c===n)done++;}
  if(done===p.x.length)file(true);}
function nextDay(){
  if(!db.sessions.length)return "Day A";
  var l=db.sessions[db.sessions.length-1].day,i;
  for(i=0;i<PLAN.length;i++)if(PLAN[i].n===l)return PLAN[(i+1)%PLAN.length].n;
  return "Day A";}

/* ============================================================
   9. charts
   ============================================================ */
function chLine(pts,col,unit,trend){
  if(pts.length<2)return '<p style="color:#5C666F;font-size:12px;margin:6px 0 0">Not enough yet - log this twice and the line appears.</p>';
  var W=320,H=112,P=26,i;
  var xs=[],ys=[];for(i=0;i<pts.length;i++){xs.push(pts[i].x);ys.push(pts[i].y);}
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  if(y1===y0){y1=y0+1;y0=y0-1;}
  var pd=(y1-y0)*0.14;y0-=pd;y1+=pd;
  function px(x){return P+(x1===x0?0.5:(x-x0)/(x1-x0))*(W-P-8);}
  function py(y){return H-20-((y-y0)/(y1-y0))*(H-34);}
  var d="",dots="";
  for(i=0;i<pts.length;i++)d+=(i?"L":"M")+px(pts[i].x).toFixed(1)+","+py(pts[i].y).toFixed(1)+" ";
  var area="M"+px(pts[0].x).toFixed(1)+","+(H-20)+" "+d.slice(1)+"L"+px(pts[pts.length-1].x).toFixed(1)+","+(H-20)+"Z";
  for(i=0;i<pts.length;i++)dots+='<circle cx="'+px(pts[i].x).toFixed(1)+'" cy="'+py(pts[i].y).toFixed(1)+'" r="2.6" fill="'+col+'"/>';
  var tl="";
  if(trend){var L=lin(pts);
    if(L)tl='<line x1="'+px(x0).toFixed(1)+'" y1="'+py(L.m*x0+L.b).toFixed(1)+
      '" x2="'+px(x1).toFixed(1)+'" y2="'+py(L.m*x1+L.b).toFixed(1)+
      '" stroke="#EDEAE3" stroke-width="1.3" stroke-dasharray="4 4" opacity=".55"/>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" style="height:112px">'+
    '<line x1="'+P+'" y1="'+(H-20)+'" x2="'+W+'" y2="'+(H-20)+'" stroke="#2E3740"/>'+
    '<path d="'+area+'" fill="'+col+'" opacity=".10"/>'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+tl+dots+
    '<text x="2" y="14" fill="#5C666F" font-size="9">'+y1.toFixed(0)+'</text>'+
    '<text x="2" y="'+(H-17)+'" fill="#5C666F" font-size="9">'+y0.toFixed(0)+'</text>'+
    (unit?'<text x="'+(W-2)+'" y="10" fill="#5C666F" font-size="9" text-anchor="end">'+esc(unit)+'</text>':'')+'</svg>';}

function chBars(vals,labs,col){
  if(!vals.length)return '<p style="color:#5C666F;font-size:12px;margin:6px 0 0">Nothing logged yet.</p>';
  var W=320,H=104,i,mx=Math.max.apply(null,vals)||1,n=vals.length,bw=(W-8)/n,out="";
  for(i=0;i<n;i++){var h=Math.max(2,(vals[i]/mx)*(H-28));
    out+='<rect x="'+(4+i*bw+bw*0.15).toFixed(1)+'" y="'+(H-18-h).toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+
      '" height="'+h.toFixed(1)+'" rx="2" fill="'+col+'" opacity="'+(i===n-1?"1":".5")+'"/>'+
      '<text x="'+(4+i*bw+bw*0.5).toFixed(1)+'" y="'+(H-5)+'" fill="#5C666F" font-size="9" text-anchor="middle">'+esc(labs[i])+'</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" style="height:104px">'+out+
    '<text x="2" y="10" fill="#5C666F" font-size="9">'+Math.round(mx)+'</text></svg>';}

function chSpark(v,col){
  if(v.length<2)return '<svg viewBox="0 0 56 20" style="width:56px;height:20px"></svg>';
  var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),i,d="";
  if(mx===mn)mx=mn+1;
  for(i=0;i<v.length;i++)d+=(i?"L":"M")+(i/(v.length-1)*54+1).toFixed(1)+","+(18-((v[i]-mn)/(mx-mn))*16).toFixed(1)+" ";
  return '<svg viewBox="0 0 56 20" style="width:56px;height:20px"><path d="'+d+'" fill="none" stroke="'+col+
    '" stroke-width="1.7" stroke-linejoin="round"/></svg>';}

/* ============================================================

function status(){
  if(mode==="claude")return '<div class="sbar">Saving to Claude automatically.</div>';
  if(mode==="browser")return '<div class="sbar">Saving to this browser automatically.</div>';
  if(mode==="starting")return '<div class="sbar">Connecting to storage. You can start typing now.</div>';

function vDay(){

  for(k=0;k<p.x.length;k++){
    var ex=p.x[k],P=presc(ex,b,wk),n=P.n,pv=prev(ex.n),pb=bestOrm(ex.n,false);
    if(!db.draft[ex.n])db.draft[ex.n]=[];

      (ex.fin?'<em>finisher</em>':'')+'</b><div class="es"><i>'+esc(P.tgt)+'</i>'+
      (pv?" &middot; last "+esc(wo(pv)?wo(pv)+"kg":"bw")+" "+esc(rp(pv)):" &middot; first time")+

        '<div class="un">kg = <b>'+esc(ex.u)+'</b></div>'+

        (pl?'<div class="lt">'+esc(pl)+'</div>':'')+
        (pv?'<div class="lt">Last time: <b>'+esc(wo(pv)?wo(pv)+" kg":"bodyweight")+'</b> &mdash; <b>'+esc(rp(pv))+'</b>'+
            (P.rir!==null&&P.rir!==undefined?', about <b>'+fmt(Math.round(P.rir*10)/10)+'</b> left in the tank':'')+
            (pb?'. Best ever '+fmt(Math.round(pb))+' kg estimated max':'')+'.</div>'
           :'<div class="lt">No history yet. Today&rsquo;s numbers become the target.</div>')+
        '<div class="cue">'+esc(ex.c)+(ex.side?" Reps are per side.":"")+'</div>'+
        '<div class="hd"><div></div><div>KG</div><div>REPS'+(ex.side?"/SIDE":"")+'</div><div>LEFT</div><div></div></div>';
      for(j=0;j<n;j++){

        h+='<div class="st"><div class="sl">'+(j+1)+'</div>'+

          '<input class="num'+cls+'" inputmode="numeric" placeholder="'+(tgtR?String(tgtR):"reps")+'" value="'+esc(d[j].r)+'" data-in="'+k+'_'+j+'_r" id="in_'+k+'_'+j+'_r">'+

         '<button class="mn" data-wipe="'+k+'">Clear</button></div></div>';}
    h+='</div>';}

function opt(v){
  var o=[["","RIR"],["0","0"],["1","1"],["2","2"],["3","3"],["4","4+"]],s="",i;
  for(i=0;i<o.length;i++)s+='<option value="'+o[i][0]+'"'+(String(v||"")===o[i][0]?" selected":"")+'>'+o[i][1]+'</option>';

/* targeted refresh, so the keyboard never loses the field you are typing in */
function syncEx(k){
  var p=PLAN[tab];if(!p)return;
  var ex=p.x[k],P=presc(ex,blk(),week()),n=P.n,d=db.draft[ex.n]||[],c=0,j;
  for(j=0;j<n;j++)if(d[j]&&d[j].r)c++;
  var card=E("ex_"+k),ix=E("ix_"+k);
  if(card)card.className="ex"+(c===n?" done":"");
  if(ix)ix.innerHTML=(c===n?"&#10003;":(k+1));
  for(j=0;j<n;j++){var el=E("in_"+k+"_"+j+"_r");if(!el)continue;

    el.className="num"+(wmsg?" bad":(cur?(P.reps&&cur>=P.reps?" beat":" miss"):""));}
  count();}

     :'<p>Put your bodyweight in the box at the top and this turns into real numbers.</p>')+

/* ============================================================

function vStats(){
  E("ttl").textContent="Stats";E("sb").textContent="how the year is going";
  var S=db.sessions,i,j,wk=week();
  if(!S.length)return status()+'<div class="mt">File a session and the analysis appears here.</div>';
  var tot=0;for(i=0;i<S.length;i++)for(j=0;j<S[i].entries.length;j++)tot+=vol(S[i].entries[j]);
  var bws=[];for(i=0;i<S.length;i++)if(S[i].bw)bws.push({x:S[i].date,y:parseFloat(S[i].bw)});
  var bwd=bws.length>1?(bws[bws.length-1].y-bws[0].y):null;
  var lastV=0,prevV=0;
  for(j=0;j<S[S.length-1].entries.length;j++)lastV+=vol(S[S.length-1].entries[j]);
  if(S.length>1)for(j=0;j<S[S.length-2].entries.length;j++)prevV+=vol(S[S.length-2].entries[j]);
  var vd=prevV?Math.round((lastV-prevV)/prevV*100):null;
  var w7=0,ago=Date.now()-6048e5;for(i=0;i<S.length;i++)if(S[i].date>=ago)w7++;

  var h=status()+'<div class="kpis">'+
    '<div class="kpi"><div class="v num">'+S.length+'</div><div class="k">sessions filed</div>'+
      '<div class="d'+(w7>=3?"":" nu")+'">'+w7+' in the last 7 days</div></div>'+
    '<div class="kpi"><div class="v num">'+wk+'</div><div class="k">week of the year</div>'+
      '<div class="d nu">Block '+(blk()+1)+' &middot; '+esc(BLOCKS[blk()].n)+'</div></div>'+
    '<div class="kpi"><div class="v num">'+(tot>=1000?(tot/1000).toFixed(1)+"t":Math.round(tot)+"kg")+'</div>'+
      '<div class="k">total volume lifted</div>'+(vd!==null?'<div class="d'+(vd<0?" dn":"")+'">'+(vd>0?"+":"")+vd+'% last session</div>':'<div class="d nu">&nbsp;</div>')+'</div>'+
    '<div class="kpi"><div class="v num">'+(bws.length?bws[bws.length-1].y.toFixed(1):"-")+'</div>'+
      '<div class="k">bodyweight kg</div>'+(bwd!==null?'<div class="d'+(bwd>0?" dn":"")+'">'+(bwd>0?"+":"")+bwd.toFixed(1)+' kg total</div>':'<div class="d nu">log it on weigh-in days</div>')+'</div></div>';

  /* bodyweight with a real rate */
  var verdict="";
  if(bws.length>2){var L=lin(bws);
    if(L){var rate=L.m*6048e5,tgt=blk()===0||blk()===3;
      var rs=fmt(Math.round(Math.abs(rate)*100)/100);
      if(tgt){
        if(rate>-0.15)verdict='<p class="lo">Trend says '+(rate>=0?"+":"-")+rs+' kg a week. That is flat for a fat-loss block - tighten the food, not the training.</p>';
        else if(rate>-0.4)verdict='<p class="lo">Trend says -'+rs+' kg a week. Moving, but slower than the 0.4 to 0.65 target. Give it two more weeks before you change anything.</p>';
        else if(rate<-0.95)verdict='<p class="hi">Trend says -'+rs+' kg a week. Too fast - you will lose strength along with the fat. Eat a bit more.</p>';
        else if(rate<-0.65)verdict='<p class="lo">Trend says -'+rs+' kg a week. Slightly quicker than ideal. Watch your top sets: if they start dropping, eat a little more.</p>';
        else verdict='<p class="ok">Trend says -'+rs+' kg a week. That is exactly the right speed - do not change anything.</p>';}
      else verdict='<p class="nu">Trend says '+(rate>=0?"+":"-")+rs+' kg a week.</p>';}}
  h+='<div class="card"><h3>Bodyweight <small>dashed line is the real trend</small></h3>'+
    '<p>Target in a fat-loss block is 0.4 to 0.65 kg down per week. Judge the dashed line, never one morning.</p>'+
    chLine(bws,"#57A97C","kg",true)+verdict+'</div>';

  /* weekly sets per muscle against the bands */
  var mv={},i2,j2,k2;
  for(i2=0;i2<S.length;i2++){if(S[i2].date<ago)continue;
    for(j2=0;j2<S[i2].entries.length;j2++){var mg=musOf(S[i2].entries[j2].name);if(!mg)continue;
      mv[mg]=(mv[mg]||0)+S[i2].entries[j2].sets.length;}}
  var ord=["back","legs","chest","shoulders","triceps","biceps","calves","core"],rows="";
  for(i2=0;i2<ord.length;i2++){var g=ord[i2],n2=mv[g]||0,bd=BAND[g],pct=Math.min(100,n2/(bd[1]*1.2)*100);
    var st=n2<bd[0]?"lo":(n2>bd[1]?"hi":"ok");
    var msg=n2<bd[0]?("low - aim for "+bd[0]):(n2>bd[1]?("a lot - "+bd[1]+" is usually plenty"):"in the right range");
    rows+='<div class="vr"><div class="vt"><span>'+esc(MUSN[g])+'</span><b class="'+st+'">'+n2+' sets</b></div>'+
      '<div class="vb"><i style="width:'+pct.toFixed(1)+'%;background:'+MUS[g]+'"></i>'+
      '<u style="left:'+(bd[0]/(bd[1]*1.2)*100).toFixed(1)+'%;width:'+((bd[1]-bd[0])/(bd[1]*1.2)*100).toFixed(1)+'%"></u></div>'+
      '<div class="vs '+st+'">'+esc(msg)+'</div></div>';}
  h+='<div class="card"><h3>Sets per muscle <small>last 7 days</small></h3>'+
    '<p>The pale band on each bar is the range that actually builds muscle over a week. Under it you are maintaining, far over it you are just accumulating fatigue.</p>'+rows+'</div>';

  /* volume per session */
  var vv=[],ll=[];
  for(i=Math.max(0,S.length-10);i<S.length;i++){var v=0;
    for(j=0;j<S[i].entries.length;j++)v+=vol(S[i].entries[j]);
    vv.push(Math.round(v));ll.push(S[i].day.replace("Day ",""));}
  h+='<div class="card"><h3>Volume per session</h3><p>Weight times reps, last 10 sessions. Climbing over weeks means it is working.</p>'+
    chBars(vv,ll,"#E0B03A")+'</div>';

  /* split of all sets ever */
  var mv2={},mt=0;
  for(i=0;i<S.length;i++)for(j=0;j<S[i].entries.length;j++){
    var g3=musOf(S[i].entries[j].name);if(!g3)continue;
    mv2[g3]=(mv2[g3]||0)+S[i].entries[j].sets.length;mt+=S[i].entries[j].sets.length;}
  var b1="",lg2="";
  for(i=0;i<ord.length;i++){var g2=ord[i],pc=mt?(mv2[g2]||0)/mt*100:0;
    if(pc>0){b1+='<i style="width:'+pc.toFixed(1)+'%;background:'+MUS[g2]+'"></i>';
      lg2+='<span><b style="background:'+MUS[g2]+'"></b>'+esc(MUSN[g2])+' '+Math.round(pc)+'%</span>';}}
  h+='<div class="card"><h3>Where your sets go <small>all time</small></h3>'+
     '<p>Back should be the biggest slice - it is your priority and it always has been.</p>'+
     '<div class="mg">'+b1+'</div><div class="lgd">'+lg2+'</div></div>';

  /* every exercise */
  var m2=allEx(),names=[],kk;
  for(kk in m2)names.push(kk);names.sort();
  var er2="";
  for(i=0;i<names.length;i++){
    var hh=m2[names[i]],mm2=meta(names[i]),col=colOf(names[i]),inv=mm2&&mm2.inv;
    var e1=hh[0].e,e2=hh[hh.length-1].e,r1=orm(e1),r2=orm(e2),ser=[];
    for(j=0;j<hh.length;j++)ser.push(inv?totR(hh[j].e):(orm(hh[j].e)||totR(hh[j].e)));
    var ch,cls="",q;
    if(inv){
      /* assistance: less weight is progress, and at the same weight more reps is progress */
      var da=topW(e2)-topW(e1);q=totR(e2)-totR(e1);
      if(da<-0.5){ch=Math.round(da)+"kg";cls="";}
      else if(da>0.5){ch="+"+Math.round(da)+"kg";cls=" dn";}
      else{ch=(q>0?"+"+q+"r":(q<0?q+"r":"-"));cls=q>0?"":(q<0?" dn":" flat");}}
    else if(r1>0&&r2>0){var dd=r2-r1;
      ch=(dd>0.5?"+"+Math.round(dd)+"kg":(dd<-0.5?Math.round(dd)+"kg":"-"));
      cls=dd>0.5?"":(dd<-0.5?" dn":" flat");}
    else{q=totR(e2)-totR(e1);ch=(q>0?"+"+q+"r":(q<0?q+"r":"-"));cls=q>0?"":(q<0?" dn":" flat");}
    er2+='<div class="pl" data-hist="'+esc(names[i])+'"><span class="nm">'+esc(names[i])+'</span>'+
      chSpark(ser,col)+'<span class="vv num">'+(topW(e2)?fmt(topW(e2))+"kg":totR(e2)+"r")+'</span>'+
      '<span class="ch'+cls+'">'+ch+'</span></div>';}
  return h+'<div class="card"><h3>Every exercise</h3><p>Latest top set, the trend, and the change since you first logged it. Tap any row for the full history.</p>'+er2+'</div>';}

function vExercise(){

      ((inv2||bwx)?"No external weight to track, so reps are the measure. The line should climb."
                 :"From your best set each session. The cleanest single measure of getting stronger.")+'</p>'+

    '<div class="card"><h3>Volume per session</h3><p>Weight times reps across all sets.</p>'+chLine(p2,"#6FA8C7","",false)+'</div>'+

/* a blank session for a day you trained but never logged */
/* history is read in array order, so a backdated session must sit in its real place */
function sortSessions(){db.sessions.sort(function(a,b){return a.date-b.date;});}

function blankSession(di,dt){
  var p=PLAN[di],b=blk(),ents=[],k,j;
  var wk=Math.max(1,Math.floor((d0(dt)-d0(db.start||START_DEFAULT))/864e5/7)+1);
  for(k=0;k<p.x.length;k++){var n=ns(p.x[k].t[b]),sets=[];
    for(j=0;j<n;j++)sets.push({w:"",r:"",q:""});
    ents.push({name:p.x[k].n,sets:sets});}
  return {date:dt,day:p.n,block:b,week:wk,bw:"",steps:"",dur:0,entries:ents};}

function chips(){

function count(){
  E("ub").style.display=undoRec?"":"none";
  if(rest.end>Date.now()){
    var left=Math.ceil((rest.end-Date.now())/1000);
    E("ct").innerHTML='<div class="tmr"><div class="tv num'+(left<=5?" go":"")+'">'+Math.floor(left/60)+":"+("0"+(left%60)).slice(-2)+
      '</div><div class="tl">resting &middot; '+esc(rest.ex)+'</div>'+
      '<button class="ab" data-act="plus" style="padding:8px 10px">+30</button>'+
      '<button class="ab" data-act="skip" style="padding:8px 10px">Skip</button></div>';
    return;}
  if(rest.end&&rest.end<=Date.now()){var nm=rest.ex;rest.end=0;
    if(tick){clearInterval(tick);tick=null;}
    beep();tst("Rest over &mdash; "+esc(nm));}
  if(typeof tab!=="number"){
    E("ct").textContent=db.sessions.length+" session"+(db.sessions.length===1?"":"s")+" filed";return;}
  var p=PLAN[tab],b=blk(),wk=week(),done=0,k,j;
  for(k=0;k<p.x.length;k++){var n=presc(p.x[k],b,wk).n,d=db.draft[p.x[k].n]||[],c=0;
    for(j=0;j<n&&j<d.length;j++)if(d[j].r)c++;
    if(c===n)done++;}
  var mins=sesStart?Math.round((Date.now()-sesStart)/60000):0;
  var el=mins?(" &middot; "+mins+" min"):"";
  E("ct").innerHTML=done+" of "+p.x.length+" done"+el+" &middot; <b>saved</b>";}

function paint(){
  var t=E("tabs").children,i;
  for(i=0;i<t.length;i++)t[i].className=(t[i].getAttribute("data-tab")===String(tab))?"sel":"";
  var h="";
  if(tab==="c")h=vCoach();
  else if(tab==="s")h=exView?vExercise():vStats();
  else if(tab==="h")h=vHistory();
  else if(tab==="b")h=vData();
  else h=vDay();
  E("app").innerHTML=h;
  chips();count();}

/* ============================================================
   15. one listener for clicks, so a button can never go dead
   ============================================================ */
document.addEventListener("click",function(ev){
  var el=ev.target,a=null,k,A=["tab","open","clr","copy","wipe","del","hist","swap","rest","edit","eclr","act"];
  for(k=0;k<6&&el;k++){
    if(el.getAttribute){var i;
      for(i=0;i<A.length;i++)if(el.getAttribute("data-"+A[i])!==null){a=[A[i],el.getAttribute("data-"+A[i])];break;}
      if(a)break;}
    el=el.parentNode;}
  if(!a)return;
  try{handle(a[0],a[1]);}catch(e){lg("CLICK ERROR",a[0]+" "+a[1]+" - "+er(e));tst("Error: "+er(e));}
},false);

function handle(kind,val){
  if(kind==="tab"){
    if(typeof tab==="number"&&val!=="0"&&val!=="1"&&val!=="2"&&hasDraft())file(true);
    exView=null;editS=-1;editBuf=null;editNew=false;
    tab=(val==="h"||val==="b"||val==="c"||val==="s")?val:+val;
    open=-1;paint();window.scrollTo(0,0);save();return;}
  if(kind==="hist"){exView=val;tab="s";open=-1;paint();window.scrollTo(0,0);return;}
  if(kind==="open"){open=(open===+val)?-1:+val;paint();
    if(open>=0){var c=E("ex_"+open);if(c&&c.scrollIntoView)c.scrollIntoView({block:"start",behavior:"smooth"});}
    return;}
  if(kind==="rest"){var ex=PLAN[tab].x[+val];startRest(restFor(ex,blk()),ex.n);tst("Resting "+restFor(ex,blk())+" seconds");return;}
  if(kind==="swap"){var e2=PLAN[tab].x[+val];
    tst("<b>"+esc(e2.n)+"</b><br>"+esc(e2.alt||"No substitute listed - pick anything that trains the same muscle in the same rep range."));return;}
  if(kind==="clr"){var p1=val.split("_");db.draft[PLAN[tab].x[+p1[0]].n][+p1[1]]={w:"",r:"",q:""};paint();save();tst("Set cleared");return;}
  if(kind==="wipe"){db.draft[PLAN[tab].x[+val].n]=[];paint();save();tst("Cleared");return;}
  if(kind==="copy"){
    var nm=PLAN[tab].x[+val].n,pv=prev(nm);
    if(!pv){tst("Nothing logged for this yet");return;}
    var n=presc(PLAN[tab].x[+val],blk(),week()).n,j;db.draft[nm]=[];
    for(j=0;j<n;j++){var s=pv.sets[j]||pv.sets[pv.sets.length-1];
      db.draft[nm].push({w:(s&&s.w)||"",r:(s&&s.r)||"",q:""});}
    paint();save();tst("Filled with last time - now beat it");return;}
  if(kind==="edit"){editS=+val;editBuf=JSON.parse(JSON.stringify(db.sessions[+val]));
    paint();window.scrollTo(0,0);return;}
  if(kind==="eclr"){if(!editBuf)return;var pe=val.split("_");
    editBuf.entries[+pe[0]].sets[+pe[1]]={w:"",r:"",q:""};paint();tst("Set emptied - Save to keep it");return;}
  if(kind==="del"){var s2=db.sessions[+val];
    if(!confirm("Delete this "+s2.day+" from "+new Date(s2.date).toLocaleDateString()+"?"))return;
    db.sessions.splice(+val,1);undoRec=null;paint();save();tst("Deleted");return;}
  if(kind==="act"){
    if(val==="back"){exView=null;paint();window.scrollTo(0,0);return;}
    if(val==="file"){file(false);return;}
    if(val==="addpast"){
      var pv2=E("pdate").value;
      if(!pv2){tst("Pick the date you trained");return;}
      var pp=pv2.split("-"),when=new Date(+pp[0],+pp[1]-1,+pp[2],12,0,0).getTime();
      if(when>Date.now()){tst("That date is in the future");return;}
      editBuf=blankSession(+E("pday").value,when);editNew=true;editS=-1;
      paint();window.scrollTo(0,0);return;}
    if(val==="ecancel"){editS=-1;editBuf=null;editNew=false;paint();tst("Nothing changed");return;}
    if(val==="esave"){
      if(!editBuf||(editS<0&&!editNew))return;
      var ents=[],j2,k2;
      for(j2=0;j2<editBuf.entries.length;j2++){var en=editBuf.entries[j2],keep=[];
        for(k2=0;k2<en.sets.length;k2++){var st=en.sets[k2];
          if(st.r&&parseInt(st.r,10)>0)keep.push({w:st.w||"",r:st.r,q:st.q||""});}
        if(keep.length)ents.push({name:en.name,sets:keep});}
      if(editNew){
        if(!ents.length){tst("Fill in at least one set first");return;}
        var rec2=editBuf;rec2.entries=ents;rec2.bw=editBuf.bw||"";
        db.sessions.push(rec2);sortSessions();
        editNew=false;editBuf=null;paint();save();
        tst("Added to week "+rec2.week+" with "+ents.length+" exercise"+(ents.length===1?"":"s")+".");return;}
      if(!ents.length){
        if(!confirm("Every set is empty. Delete this whole session?")){return;}
        db.sessions.splice(editS,1);editS=-1;editBuf=null;undoRec=null;
        paint();save();tst("Session deleted");return;}
      db.sessions[editS].entries=ents;db.sessions[editS].bw=editBuf.bw||"";
      editS=-1;editBuf=null;paint();save();tst("Saved. Your next target is worked out from the corrected numbers.");return;}
    if(val==="skip"){stopRest();return;}
    if(val==="plus"){rest.end+=30000;count();return;}
    if(val==="undo"){if(!undoRec)return;
      db.sessions=db.sessions.filter(function(x){return x.date!==undoRec.date;});
      db.draft=undoRec.draft;undoRec=null;paint();save();tst("Undone");return;}
    if(val==="setstart"){var v=E("sdt").value;if(!v){tst("Pick a date first");return;}
      var pr=v.split("-");db.start=new Date(+pr[0],+pr[1]-1,+pr[2]).getTime();
      db.blockAuto=true;E("blk").value=blockFor(week());db.block=blk();
      paint();save();tst("Start set - you are in week "+week());return;}
    if(val==="copy"){var t=E("ta");t.select();
      try{document.execCommand("copy");tst("Copied");}catch(e){tst("Select the text and copy manually");}return;}
    if(val==="csv"){var c="date,week,day,block,bodyweight,steps,exercise,set,kg,reps,rir\n",ci,cj,ck;
      for(ci=0;ci<db.sessions.length;ci++){var cs=db.sessions[ci];
        for(cj=0;cj<cs.entries.length;cj++)for(ck=0;ck<cs.entries[cj].sets.length;ck++)
          c+=new Date(cs.date).toISOString().slice(0,10)+","+(cs.week||"")+","+cs.day+","+(cs.block+1)+","+
             (cs.bw||"")+","+(cs.steps||"")+',"'+cs.entries[cj].name+'",'+(ck+1)+","+
             (cs.entries[cj].sets[ck].w||"")+","+cs.entries[cj].sets[ck].r+","+(cs.entries[cj].sets[ck].q||"")+"\n";}
      dlFile(c,"logbook.csv","text/csv");return;}
    if(val==="dl"){dlFile(JSON.stringify(db,null,2),"logbook.json","application/json");return;}
    if(val==="restore"){try{
      var inc=JSON.parse(E("ri").value);if(!inc||!inc.sessions)throw 0;
      var seen={},all=db.sessions.concat(inc.sessions).filter(function(x){
        var k2=x.date+"|"+x.day;if(seen[k2])return false;seen[k2]=1;return true;});
      db.sessions=all;sortSessions();paint();save();tst("Restored "+all.length+" sessions");
    }catch(e){tst("Could not read that backup");}return;}
    if(val==="wipe"){if(!confirm("Delete every filed session?"))return;
      db.sessions=[];db.draft={};undoRec=null;paint();save();tst("All deleted");return;}
    if(val==="test"){lg("test","writing...");
      save().then(function(ok){if(!ok){lg("test","write failed");paint();return;}
        getFn().then(function(v){lg("test",v?("read back "+String(v).length+" chars - SAVING WORKS"):"read back EMPTY - not persisting");paint();},
          function(e){lg("test","read failed: "+er(e));paint();});});return;}
    if(val==="cplog"){
      var txt="LOGBOOK DEBUG\n",i;
      txt+="protocol: "+location.protocol+"\nwindow.storage: "+(window.storage?"yes":"no")+"\nmode: "+mode+"\nnote: "+note+"\n\n";
      for(i=0;i<LOG.length;i++)txt+=LOG[i].t+"s ["+LOG[i].g+"] "+LOG[i].m+"\n";
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(function(){tst("Report copied");},function(){prompt("Copy this:",txt);});
      else prompt("Copy this:",txt);return;}}}

function dlFile(txt,name,type){
  try{var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;
    document.body.appendChild(a);a.click();document.body.removeChild(a);tst("Downloaded "+name);
  }catch(e){tst("Blocked - use Select & copy instead");}}

/* ============================================================
   16. typing
   ============================================================ */
document.addEventListener("input",function(ev){
  var g=ev.target.getAttribute&&ev.target.getAttribute("data-ein");
  if(g&&editBuf){
    if(g==="bw"){editBuf.bw=ev.target.value;return;}
    var pg=g.split("_");editBuf.entries[+pg[0]].sets[+pg[1]][pg[2]]=ev.target.value;return;}
  var k=ev.target.getAttribute&&ev.target.getAttribute("data-in");
  if(!k||typeof tab!=="number")return;
  var p=k.split("_"),ex=PLAN[tab].x[+p[0]],nm=ex.n;
  if(!db.draft[nm])db.draft[nm]=[];
  while(db.draft[nm].length<=+p[1])db.draft[nm].push({w:"",r:"",q:""});
  db.draft[nm][+p[1]][p[2]]=ev.target.value;
  if(!sesStart)sesStart=Date.now();
  syncEx(+p[0]);          /* targeted - never rebuilds the field you are in */
  qsave();
},false);

/* a finished rep box starts the rest clock and checks for a personal record */
document.addEventListener("change",function(ev){
  var g=ev.target.getAttribute&&ev.target.getAttribute("data-ein");
  if(g&&editBuf){
    if(g==="bw"){editBuf.bw=ev.target.value;return;}
    var pg=g.split("_");editBuf.entries[+pg[0]].sets[+pg[1]][pg[2]]=ev.target.value;return;}
  var k=ev.target.getAttribute&&ev.target.getAttribute("data-in");
  if(!k||typeof tab!=="number")return;
  var p=k.split("_");
  if(p[2]!=="r"||!ev.target.value)return;
  var ex=PLAN[tab].x[+p[0]],d=db.draft[ex.n][+p[1]];
  startRest(restFor(ex,blk()),ex.n);
  if(!ex.bw&&!ex.inv&&d.w&&d.r&&!odd(ex.n,d.w,d.r)){
    var o=(parseFloat(d.w)||0)*(1+(parseInt(d.r,10)||0)/30),best=bestOrm(ex.n,false);
    if(best>0&&o>best*1.005&&!d.pr){d.pr=1;
      tst("Personal record on "+esc(ex.n)+"<br>"+fmt(d.w)+" kg x "+esc(d.r)+" beats everything you have logged.","pr");}}
  autoFile();
},false);

E("blk").onchange=function(){db.block=blk();db.blockAuto=false;paint();save();};
E("bw").onchange=function(){db.bw=E("bw").value;save();};
E("stp").onchange=function(){db.steps=E("stp").value;save();};

/* ============================================================
   17. boot
   ============================================================ */
function migrate(d){
  if(!d||!d.sessions)return null;
  if(!d.v){lg("migrate","v1 data, "+d.sessions.length+" sessions");
    d.v=2;
    if(!d.start)d.start=START_DEFAULT;
    if(d.blockAuto===undefined)d.blockAuto=true;
    var i,j,k;
    for(i=0;i<d.sessions.length;i++){var s=d.sessions[i];
      if(!s.week)s.week=Math.max(1,Math.floor((d0(s.date)-d0(d.start))/864e5/7)+1);
      if(s.steps===undefined)s.steps="";
      for(j=0;j<s.entries.length;j++)for(k=0;k<s.entries[j].sets.length;k++)
        if(s.entries[j].sets[k].q===undefined)s.entries[j].sets[k].q="";}}
  if(!d.draft)d.draft={};
  if(!d.start)d.start=START_DEFAULT;
  d.sessions.sort(function(a,b){return a.date-b.date;});
  return d;}

paint();
initStore().then(function(raw){
  if(raw){try{var d=migrate(JSON.parse(raw));
    if(d){db=d;
      if(typeof db.tab==="number"||db.tab==="c"||db.tab==="s"||db.tab==="h"||db.tab==="b")tab=db.tab;
      E("bw").value=db.bw||"";E("stp").value=db.steps||"";
      E("blk").value=(db.blockAuto===false)?(db.block||0):blockFor(week());
      db.block=blk();
      lg("load","restored "+db.sessions.length+" sessions, week "+week());}
  }catch(e){lg("load","could not read stored data: "+er(e));}}
  else{lg("load","nothing stored yet - starting from your week 1 Day A");
    E("bw").value=db.bw||"";E("stp").value=db.steps||"";
    E("blk").value=blockFor(week());db.block=blk();}
  paint();save();
},function(e){lg("boot","storage init rejected: "+er(e));paint();});

})();
</script>
